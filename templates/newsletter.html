<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일일 뉴스레터 {{ date }}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #f5f5f5; color: #222; }
  .container { max-width: 800px; margin: 0 auto; padding: 24px 16px; }

  .header { background: #1a1a2e; color: #fff; padding: 32px; border-radius: 12px; margin-bottom: 24px; }
  .header h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
  .header .date { color: #a0aec0; font-size: 0.9rem; }

  .category-card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .category-label { display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 700; margin-bottom: 14px; }
  .label-경제 { background: #ebf8ff; color: #2b6cb0; }
  .label-산업 { background: #f0fff4; color: #276749; }
  .label-사회 { background: #fffaf0; color: #c05621; }
  .label-정치 { background: #faf5ff; color: #6b46c1; }

  .summary-box { background: #f8f9fa; border-left: 3px solid #4a5568; padding: 14px 16px; border-radius: 0 8px 8px 0; margin-bottom: 16px; font-size: 0.9rem; line-height: 1.75; white-space: pre-line; }

  .articles { margin-top: 14px; }
  .article-item { padding: 10px 0; border-bottom: 1px solid #eee; font-size: 0.85rem; }
  .article-item:last-child { border-bottom: none; }
  .article-item a { color: #2d3748; text-decoration: none; font-weight: 500; }
  .article-item a:hover { color: #3182ce; }
  .article-source { color: #a0aec0; font-size: 0.78rem; margin-top: 2px; }

  .footer { text-align: center; color: #a0aec0; font-size: 0.78rem; padding: 24px 0; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>오늘의 뉴스레터</h1>
    <div class="date">{{ date }} (KST) &nbsp;·&nbsp; 자동 생성</div>
  </div>

  {% for item in summaries %}
  <div class="category-card">
    <span class="category-label label-{{ item.category }}">{{ item.category }}</span>
    <div class="summary-box">{{ item.summary }}</div>
    <div class="articles">
      {% for article in item.top_articles %}
      <div class="article-item">
        <a href="{{ article.url }}" target="_blank">{{ article.title }}</a>
        <div class="article-source">{{ article.source }}</div>
      </div>
      {% endfor %}
    </div>
  </div>
  {% endfor %}

  <div class="footer">자동 생성된 뉴스레터입니다 · wookjong00@gmail.com</div>
</div>
</body>
</html>
